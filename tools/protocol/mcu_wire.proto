syntax = "proto3";

package rpc.pb;

import "config_schema.proto";

message VersionResponse {
  option (msg_cloud_topic) = "evt/rpc.pb.SystemService/VersionResponse";
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

message FreeMemoryResponse {
  option (msg_cloud_topic) = "evt/rpc.pb.SystemService/FreeMemoryResponse";
  uint32 value = 1;
}

message Capabilities {
  option (msg_cloud_topic) = "evt/rpc.pb.SystemService/Capabilities";
  uint32 ver = 1;
  uint32 arch = 2;
  uint32 dig = 3;
  uint32 ana = 4;
  bool watchdog = 5;
  bool debug_frames = 6;
  bool debug_io = 7;
  bool eeprom = 8;
  bool dac = 9;
  bool hw_serial1 = 10;
  bool fpu = 11;
  bool logic_3v3 = 12;
  bool big_buffer = 13;
  bool i2c = 14;
  bool spi = 15;
  bool sd = 16;
  uint32 feat = 17;
  string board_name = 18;
  bool clock_sync = 19;
}

message PinMode {
  uint32 pin = 1;
  PinModeType mode = 2;
}

message DigitalWrite {
  uint32 pin = 1;
  uint32 value = 2;
}

message AnalogWrite {
  uint32 pin = 1;
  uint32 value = 2;
}

message PinRead {
  uint32 pin = 1;
}

message ClockSyncRequest {
  uint64 host_time_us = 1;
}

message ClockSyncResponse {
  uint64 host_time_us = 1;
  uint32 mcu_time_us = 2;
}

message PinSubscribeRequest {
  uint32 pin = 1;
  PinModeType mode = 2;
  uint32 interval_ms = 3;
  uint32 hysteresis = 4;
  bool enabled = 5;
}

message PinSubscribeResponse {
  option (msg_error_init) = "success=False";
  uint32 pin = 1;
  bool success = 2;
}

message PinUpdateEvent {
  option (msg_cloud_topic) = "evt/rpc.pb.GpioService/PinUpdateEvent";
  uint32 pin = 1;
  uint32 value = 2;
  uint32 timestamp_micros = 3;
}

message DigitalReadResponse {
  uint32 value = 1;
}

message AnalogReadResponse {
  uint32 value = 1;
}

message ConsoleWrite {
  bytes data = 1;
}

message DatastorePut {
  string key = 1;
  bytes value = 2;
}

message DatastoreGet {
  string key = 1;
}

message DatastoreGetResponse {
  bytes value = 1;
}

message MailboxPush {
  bytes data = 1;
}

message MailboxProcessed {
  uint32 message_id = 1;
}

message MailboxAvailableResponse {
  uint32 count = 1;
}

message MailboxReadResponse {
  bytes content = 1;
}

message FileRemove {
  string path = 1;
}

// ADR-0007 (E6): the MCU exposes `size` bytes on the pw_transfer resource
// FILE_UPLOAD_RESOURCE_ID; the daemon reads them and stores them at `path`
// under file_system_root, then completes this call with a status.
message FileUpload {
  string path = 1;
  uint32 size = 2;
}

message ProcessRunAsync {
  string command = 1;
}

message ProcessRunAsyncResponse {
  option (msg_error_init) = "pid=0";
  uint32 pid = 1;
}

message ProcessPoll {
  uint32 pid = 1;
}

message ProcessPollResponse {
  option (msg_error_init) = "finished=True";
  uint32 status = 1;
  uint32 exit_code = 2;
  bytes stdout_data = 3;
  bytes stderr_data = 4;
  bool finished = 5;
  bool stdout_truncated = 6;
  bool stderr_truncated = 7;
}

message ProcessKill {
  uint32 pid = 1;
}

message SetBaudratePacket {
  uint32 baudrate = 1;
}

// LinkSync uses a 16-byte challenge. With a configured shared secret, the
// request tag authenticates the host and the response tag uses a distinct
// HKDF info string to authenticate the MCU. With no secret, the tag is empty;
// this disables authentication and frame encryption. With a secret, all HDLC
// channels use ChaCha20-Poly1305 after the handshake. LinkReset remains a
// plaintext session-reset control operation.
message LinkSync {
  bytes nonce = 1;
  bytes tag = 2;
  // Handshake v2 (ADR-0005): the MCU's never-repeating nonce, set only in the
  // MCU's response. The response tag and the session-key salt cover
  // nonce || mcu_nonce, so a replayed host LinkSync yields fresh keys.
  bytes mcu_nonce = 3;
}

message EnterBootloader {
  uint32 magic = 1;
}

message SpiTransfer {
  bytes data = 1;
}

message SpiTransferResponse {
  option (msg_cloud_topic) = "res/rpc.pb.SpiService/Transfer";
  bytes data = 1;
}

enum SpiBitOrder {
  SPI_BIT_ORDER_LSB_FIRST = 0;
  SPI_BIT_ORDER_MSB_FIRST = 1;
}

enum SpiDataMode {
  SPI_DATA_MODE_0 = 0;
  SPI_DATA_MODE_1 = 4;
  SPI_DATA_MODE_2 = 8;
  SPI_DATA_MODE_3 = 12;
}

message SpiConfig {
  SpiBitOrder bit_order = 1;
  SpiDataMode data_mode = 2;
  uint32 frequency = 3;
}

message SupervisorSnapshot {
  uint32 restarts = 1;
  float last_failure_unix = 2;
  string last_exception = 3;
  float backoff_seconds = 4;
  bool fatal = 5;
}

message CloudDropCount {
  string topic = 1;
  uint32 count = 2;
}

message QueueDepths {
  uint32 cloud_publish = 1;
  uint32 console = 2;
  uint32 mailbox_outgoing = 3;
  uint32 mailbox_incoming = 4;
  uint32 running_processes = 5;
}

message SupervisorEntry {
  string name = 1;
  SupervisorSnapshot stats = 2;
}

message ComponentRetry {
  string component = 1;
  uint32 count = 2;
}

message McuStatusCount {
  string status = 1;
  uint32 count = 2;
}

message DaemonMetrics {
  option (msg_cloud_topic) = "evt/rpc.pb.SystemService/Metrics";
  uint32 cloud_queue_depth = 1;
  uint32 cloud_dropped_messages = 2;
  repeated CloudDropCount cloud_drop_counts = 3;
  uint32 cloud_spool_corrupt_dropped = 4;
  uint32 cloud_spool_dropped_limit = 5;
  uint32 cloud_spool_trim_events = 6;
  double cloud_spool_last_trim_unix = 7;
  bool cloud_spool_degraded = 8;
  string cloud_spool_failure_reason = 9;
  uint32 cloud_spool_pending_messages = 10;
  QueueDepths queue_depths = 11;
  bool link_synchronised = 12;
  uint32 unknown_command_count = 13;
  uint32 unknown_command_last_id = 14;
  repeated SupervisorEntry supervisors = 15;
  double heartbeat_unix = 16;
  bool watchdog_enabled = 17;
  double watchdog_interval = 18;
  uint64 serial_bytes_sent = 19;
  uint64 serial_bytes_received = 20;
  uint64 serial_frames_sent = 21;
  uint64 serial_frames_received = 22;
  uint32 serial_retries = 23;
  uint32 serial_failures = 24;
  uint32 serial_crc_errors = 25;
  uint32 serial_decode_errors = 26;
  double serial_latency_ms = 27;
  double rpc_latency_ms = 28;
  uint32 handshake_attempts = 29;
  uint32 handshake_successes = 30;
  string handshake_state = 31;
  string link_state = 32;
  uint64 watchdog_beats = 33;
  double uptime_seconds = 34;
  uint64 cloud_messages_published = 35;
  repeated ComponentRetry retries = 36;
  repeated McuStatusCount mcu_status_counts = 37;
}

message SubscribeRequest {}

message Empty {}

service GpioService {
  rpc SetPinMode(rpc.pb.PinMode) returns (rpc.pb.Empty) {
    option (auth_field) = "digital_mode";
  }
  rpc DigitalWrite(rpc.pb.DigitalWrite) returns (rpc.pb.Empty) {
    option (auth_field) = "digital_write";
  }
  rpc DigitalRead(rpc.pb.PinRead) returns (rpc.pb.DigitalReadResponse) {
    option (auth_field) = "digital_read";
  }
  rpc AnalogWrite(rpc.pb.AnalogWrite) returns (rpc.pb.Empty) {
    option (auth_field) = "analog_write";
  }
  rpc AnalogRead(rpc.pb.PinRead) returns (rpc.pb.AnalogReadResponse) {
    option (auth_field) = "analog_read";
  }
  rpc SubscribePins(rpc.pb.PinSubscribeRequest) returns (stream rpc.pb.PinUpdateEvent) {
    option (auth_field) = "gpio_subscribe";
  }
}

service SystemService {
  rpc GetVersion(rpc.pb.SubscribeRequest) returns (rpc.pb.VersionResponse) {
    option (auth_field) = "system_version";
  }
  rpc GetFreeMemory(rpc.pb.SubscribeRequest) returns (rpc.pb.FreeMemoryResponse) {
    option (auth_field) = "system_free_memory";
  }
  rpc LinkSync(rpc.pb.LinkSync) returns (rpc.pb.LinkSync) {
    option (method_description) = "Synchronize link state with mutual authentication. Payload: [16-byte Nonce] + [16-byte HMAC Tag (optional)].";
    option (pre_sync_allowed) = true;
  }
  rpc LinkReset(rpc.pb.SubscribeRequest) returns (rpc.pb.Empty) {
    option (method_description) = "Reset link state and clear any active session keys prior to LinkSync.";
  }
  rpc GetCapabilities(rpc.pb.SubscribeRequest) returns (rpc.pb.Capabilities);
  rpc SetBaudrate(rpc.pb.SetBaudratePacket) returns (rpc.pb.SetBaudratePacket);
  rpc EnterBootloader(rpc.pb.EnterBootloader) returns (rpc.pb.Empty) {
    option (auth_field) = "system_bootloader";
  }
  rpc Xoff(rpc.pb.SubscribeRequest) returns (rpc.pb.Empty) {
    option (method_description) = "Signal MCU RX buffer pressure (XOFF flow control). Linux pauses TX.";
  }
  rpc Xon(rpc.pb.SubscribeRequest) returns (rpc.pb.Empty) {
    option (method_description) = "Signal MCU RX buffer relief (XON flow control). Linux resumes TX.";
  }
}

service ClockSyncService {
  rpc ClockSync(rpc.pb.ClockSyncRequest) returns (rpc.pb.ClockSyncResponse) {
    option (auth_field) = "clock_sync";
  }
}

service SpiService {
  rpc Begin(rpc.pb.SubscribeRequest) returns (rpc.pb.Empty) {
    option (auth_field) = "spi_begin";
  }
  rpc End(rpc.pb.SubscribeRequest) returns (rpc.pb.Empty) {
    option (auth_field) = "spi_end";
  }
  rpc SetConfig(rpc.pb.SpiConfig) returns (rpc.pb.Empty) {
    option (auth_field) = "spi_config";
  }
  rpc Transfer(rpc.pb.SpiTransfer) returns (rpc.pb.SpiTransferResponse) {
    option (auth_field) = "spi_transfer";
  }
}

service FileSystemService {
  rpc Remove(rpc.pb.FileRemove) returns (rpc.pb.Empty) {
    option (auth_field) = "file_remove";
  }
  rpc Upload(rpc.pb.FileUpload) returns (rpc.pb.Empty) {
    option (auth_field) = "file_write";
  }
}

service MailboxService {
  rpc Push(rpc.pb.MailboxPush) returns (rpc.pb.Empty) {
    option (cloud_topic) = "evt/rpc.pb.MailboxService/Push";
    option (auth_field) = "mailbox_write";
  }
  rpc Read(rpc.pb.SubscribeRequest) returns (rpc.pb.MailboxReadResponse) {
    option (auth_field) = "mailbox_read";
  }
  rpc Available(rpc.pb.SubscribeRequest) returns (rpc.pb.MailboxAvailableResponse);
  rpc Processed(rpc.pb.MailboxProcessed) returns (rpc.pb.Empty) {
    option (cloud_topic) = "evt/rpc.pb.MailboxService/Processed";
  }
}

service ProcessService {
  rpc RunAsync(rpc.pb.ProcessRunAsync) returns (rpc.pb.ProcessRunAsyncResponse) {
    option (auth_field) = "shell_run_async";
  }
  rpc Poll(rpc.pb.ProcessPoll) returns (rpc.pb.ProcessPollResponse) {
    option (auth_field) = "shell_poll";
  }
  rpc Kill(rpc.pb.ProcessKill) returns (rpc.pb.Empty) {
    option (auth_field) = "shell_kill";
  }
}

service DataStoreService {
  rpc Put(rpc.pb.DatastorePut) returns (rpc.pb.Empty) {
    option (auth_field) = "datastore_put";
  }
  rpc Get(rpc.pb.DatastoreGet) returns (rpc.pb.DatastoreGetResponse) {
    option (auth_field) = "datastore_get";
  }
}
