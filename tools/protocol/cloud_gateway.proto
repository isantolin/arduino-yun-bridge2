syntax = "proto3";

package rpc.pb;

import "config_schema.proto";
import "mcu_wire.proto";

message SystemStatus {
  float cpu_percent = 1;
  uint64 memory_total_bytes = 2;
  uint64 memory_available_bytes = 3;
  float load_avg_1m = 4;
  float uptime_seconds = 5;
}

message SerialLinkSnapshot {
  bool connected = 1;
  bool writer_attached = 2;
  bool synchronised = 3;
}

message HandshakeSnapshot {
  option (msg_cloud_topic) = "system/bridge/handshake/value";
  bool synchronised = 1;
  uint32 attempts = 2;
  uint32 successes = 3;
  uint32 failures = 4;
  uint32 failure_streak = 5;
  string last_error = 6;
  float last_unix = 7;
  float last_duration = 8;
  float backoff_until = 9;
  float rate_limit_until = 10;
  uint32 fatal_count = 11;
  string fatal_reason = 12;
  string fatal_detail = 13;
  float fatal_unix = 14;
  bool pending_nonce = 15;
  uint32 nonce_length = 16;
  string reason = 17;
  string detail = 18;
  string fsm_state = 19;
  string event = 20;
}

message PipelineEvent {
  string event = 1;
  uint32 command_id = 2;
  uint32 attempt = 3;
  bool ack_received = 4;
  uint32 status = 5;
  float timestamp = 6;
}

message SerialPipelineSnapshot {
  PipelineEvent inflight = 1;
  PipelineEvent last_completion = 2;
}

message SerialFlowSnapshot {
  uint32 commands_sent = 1;
  uint32 commands_acked = 2;
  uint32 retries = 3;
  uint32 failures = 4;
  float last_event_unix = 5;
}

message BridgeSnapshot {
  option (msg_cloud_topic) = "system/bridge/summary/value";
  SerialLinkSnapshot serial_link = 1;
  HandshakeSnapshot handshake = 2;
  SerialPipelineSnapshot serial_pipeline = 3;
  SerialFlowSnapshot serial_flow = 4;
  VersionResponse mcu_version = 5;
  Capabilities capabilities = 6;
}

message SerialThroughputStats {
  uint64 bytes_sent = 1;
  uint64 bytes_received = 2;
  uint32 frames_sent = 3;
  uint32 frames_received = 4;
  float last_tx_unix = 5;
  float last_rx_unix = 6;
}

message ProcessStats {
  string name = 1;
  float cpu_percent = 2;
  uint64 memory_rss_bytes = 3;
}

message UserProperty {
  string key = 1;
  string value = 2;
}

message CloudQueuedPublish {
  string topic_name = 1;
  bytes payload = 2;
  uint32 qos = 3;
  bool retain = 4;
  optional string content_type = 5;
  optional uint32 payload_format_indicator = 6;
  optional uint32 message_expiry_interval = 7;
  optional string response_topic = 8;
  optional bytes correlation_data = 9;
  repeated UserProperty user_properties = 10;

  repeated uint32 subscription_identifier = 11;
  optional uint32 topic_alias = 12;
}

message PinControlRequest {
  string state = 1;
}

message PinControlData {
  uint32 pin = 1;
  string state = 2;
}

message PinControlResponse {
  string status = 1;
  optional string message = 2;
  optional PinControlData data = 3;
}

message StatusReport {
  option (msg_cloud_topic) = "system/status";
  uint32 status = 1;
  string name = 2;
  string description = 3;
  string message = 4;
  string topic = 5;
  string action = 6;
  uint32 pin = 7;
  string reason = 8;
}

message BridgeStatus {
  DaemonMetrics metrics = 1;
  BridgeSnapshot bridge = 2;
  repeated ProcessStats process_stats = 3;
  SystemStatus system = 4;
}

message KeepalivePing {
  uint32 interval_ms = 1;
}

message KeepalivePong {
  uint32 roundtrip_ms = 1;
}

message TelemetryReport {
  bytes daemon_metrics_blob = 1 [(telemetry_topic_match) = "metrics"];
  bytes system_status_blob = 2 [(telemetry_topic_default) = true];
  bytes bridge_snapshot_blob = 3 [(telemetry_topic_match) = "summary"];
  bytes handshake_snapshot_blob = 4 [(telemetry_topic_match) = "handshake"];
}

message CommandRequest {
  string command_path = 1;
  bytes payload = 2;
}

message CommandResponse {
  uint32 status_code = 1;
  string error_message = 2;
  bytes payload = 3;
}

message EventNotification {
  string event_type = 1;
  string severity = 2;
  string description = 3;
}

message CloudEnvelope {
  uint32 protocol_version = 1;
  string device_id = 2;
  uint64 sequence_id = 3;
  uint64 timestamp_utc = 4;
  bytes hmac_signature = 5;
  oneof payload {
    KeepalivePing ping = 6;
    KeepalivePong pong = 7;
    TelemetryReport telemetry = 8;
    CommandRequest command_request = 9;
    CommandResponse command_response = 10;
    EventNotification event = 11;
  }
}

message CommandDispatch {
  string target_device_id = 1;
  string command_path = 2;
  bytes payload = 3;
  uint32 timeout_seconds = 4;
}

service CloudBridge {
  rpc Session(stream CloudEnvelope) returns (stream CloudEnvelope);
  rpc DispatchCommand(CommandDispatch) returns (CommandResponse);
}

message SubscribeRequest {}

service LocalBridge {
  // Hardware & Pin Operations
  rpc SetPinMode(rpc.pb.PinMode) returns (rpc.pb.GenericResponse) {
    option (rpc.pb.rpc_topic) = "gpio.set_mode";
  }
  rpc DigitalWrite(rpc.pb.DigitalWrite) returns (rpc.pb.GenericResponse) {
    option (rpc.pb.rpc_topic) = "gpio.write";
  }
  rpc DigitalRead(rpc.pb.PinRead) returns (rpc.pb.DigitalReadResponse) {
    option (rpc.pb.rpc_topic) = "gpio.read";
  }
  rpc AnalogWrite(rpc.pb.AnalogWrite) returns (rpc.pb.GenericResponse) {
    option (rpc.pb.rpc_topic) = "gpio.analog_write";
  }
  rpc AnalogRead(rpc.pb.PinRead) returns (rpc.pb.AnalogReadResponse) {
    option (rpc.pb.rpc_topic) = "gpio.analog_read";
  }
  rpc PinSubscribe(rpc.pb.PinSubscribeRequest) returns (rpc.pb.PinSubscribeResponse) {
    option (rpc.pb.rpc_topic) = "gpio.subscribe";
  }

  // Datastore Key-Value Operations
  rpc DatastorePut(rpc.pb.DatastorePut) returns (rpc.pb.GenericResponse) {
    option (rpc.pb.rpc_topic) = "datastore.put";
  }
  rpc DatastoreGet(rpc.pb.DatastoreGet) returns (rpc.pb.DatastoreGetResponse) {
    option (rpc.pb.rpc_topic) = "datastore.get";
  }

  // Mailbox FIFO Operations
  rpc MailboxPush(rpc.pb.MailboxPush) returns (rpc.pb.GenericResponse) {
    option (rpc.pb.rpc_topic) = "mailbox.push";
  }
  rpc MailboxRead(rpc.pb.SubscribeRequest) returns (rpc.pb.MailboxReadResponse) {
    option (rpc.pb.rpc_topic) = "mailbox.read";
  }

  // File System Operations
  rpc FileWrite(rpc.pb.FileWrite) returns (rpc.pb.GenericResponse) {
    option (rpc.pb.rpc_topic) = "file.write";
  }
  rpc FileRead(rpc.pb.FileRead) returns (rpc.pb.FileReadResponse) {
    option (rpc.pb.rpc_topic) = "file.read";
  }
  rpc FileRemove(rpc.pb.FileRemove) returns (rpc.pb.GenericResponse) {
    option (rpc.pb.rpc_topic) = "file.remove";
  }

  // Process & Shell Execution
  rpc ProcessRunAsync(rpc.pb.ProcessRunAsync) returns (rpc.pb.ProcessRunAsyncResponse) {
    option (rpc.pb.rpc_topic) = "process.run_async";
  }
  rpc ProcessPoll(rpc.pb.ProcessPoll) returns (rpc.pb.ProcessPollResponse) {
    option (rpc.pb.rpc_topic) = "process.poll";
  }
  rpc ProcessKill(rpc.pb.ProcessKill) returns (rpc.pb.GenericResponse) {
    option (rpc.pb.rpc_topic) = "process.kill";
  }

  // SPI Bus Operations
  rpc SpiTransfer(rpc.pb.SpiTransfer) returns (rpc.pb.SpiTransferResponse) {
    option (rpc.pb.rpc_topic) = "spi.transfer";
  }
  rpc SpiConfigure(rpc.pb.SpiConfig) returns (rpc.pb.GenericResponse) {
    option (rpc.pb.rpc_topic) = "spi.configure";
    option (rpc.pb.rpc_command) = "CMD_SPI_SET_CONFIG";
  }

  // System Telemetry & Introspection
  rpc GetVersion(rpc.pb.SubscribeRequest) returns (rpc.pb.VersionResponse) {
    option (rpc.pb.rpc_topic) = "system.version";
  }
  rpc GetFreeMemory(rpc.pb.SubscribeRequest) returns (rpc.pb.FreeMemoryResponse) {
    option (rpc.pb.rpc_topic) = "system.free_memory";
  }
  rpc GetStatus(rpc.pb.SubscribeRequest) returns (rpc.pb.BridgeStatus) {
    option (rpc.pb.rpc_topic) = "system.status";
  }
  rpc EnterBootloader(rpc.pb.EnterBootloader) returns (rpc.pb.GenericResponse) {
    option (rpc.pb.rpc_topic) = "system.bootloader";
  }

  // Real-Time Console Streaming & Generic Fallback
  rpc ConsoleWrite(rpc.pb.ConsoleWrite) returns (rpc.pb.GenericResponse) {
    option (rpc.pb.rpc_topic) = "console.write";
    option (rpc.pb.rpc_aliases) = "console.in";
  }
  rpc ClockSync(rpc.pb.ClockSyncRequest) returns (rpc.pb.ClockSyncResponse) {
    option (rpc.pb.rpc_topic) = "clock.sync";
  }
  rpc SubscribeConsole(rpc.pb.SubscribeRequest) returns (stream rpc.pb.CloudQueuedPublish);
  rpc Publish(rpc.pb.CloudQueuedPublish) returns (rpc.pb.CloudQueuedPublish);
}
