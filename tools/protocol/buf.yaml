version: v2
modules:
  - path: .
lint:
  use:
    - DIRECTORY_SAME_PACKAGE
    - PACKAGE_DEFINED
    - PACKAGE_NO_IMPORT_CYCLE
    - PACKAGE_SAME_DIRECTORY
    - ENUM_FIRST_VALUE_ZERO
    - ENUM_NO_ALLOW_ALIAS
    - ENUM_PASCAL_CASE
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - FIELD_LOWER_SNAKE_CASE
    - FIELD_NOT_REQUIRED
    - IMPORT_NO_PUBLIC
    - IMPORT_USED
    - MESSAGE_PASCAL_CASE
    - ONEOF_LOWER_SNAKE_CASE
    - PACKAGE_LOWER_SNAKE_CASE
    - RPC_PASCAL_CASE
    - SERVICE_PASCAL_CASE
    - SYNTAX_SPECIFIED
    - FILE_LOWER_SNAKE_CASE
breaking:
  use:
    - FILE
