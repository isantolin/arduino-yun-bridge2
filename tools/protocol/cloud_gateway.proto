syntax = "proto3";

package rpc.pb;

import "config_schema.proto";
import "mcu_wire.proto";

message SystemStatus {
  float cpu_percent = 1;
  uint64 memory_total_bytes = 2;
  uint64 memory_available_bytes = 3;
  float load_avg_1m = 4;
  float uptime_seconds = 5;
}

message SerialLinkSnapshot {
  bool connected = 1;
  bool writer_attached = 2;
  bool synchronised = 3;
}

message HandshakeSnapshot {
  option (msg_cloud_topic) = "evt/rpc.pb.SystemService/HandshakeSnapshot";
  bool synchronised = 1;
  uint32 attempts = 2;
  uint32 successes = 3;
  uint32 failures = 4;
  uint32 failure_streak = 5;
  string last_error = 6;
  float last_unix = 7;
  float last_duration = 8;
  float backoff_until = 9;
  float rate_limit_until = 10;
  uint32 fatal_count = 11;
  string fatal_reason = 12;
  string fatal_detail = 13;
  float fatal_unix = 14;
  bool pending_nonce = 15;
  uint32 nonce_length = 16;
  string reason = 17;
  string detail = 18;
  string fsm_state = 19;
  string event = 20;
}

message BridgeSnapshot {
  option (msg_cloud_topic) = "evt/rpc.pb.SystemService/BridgeSnapshot";
  SerialLinkSnapshot serial_link = 1;
  HandshakeSnapshot handshake = 2;
  VersionResponse mcu_version = 5;
  Capabilities capabilities = 6;
}

message ProcessStats {
  string name = 1;
  float cpu_percent = 2;
  uint64 memory_rss_bytes = 3;
}

message UserProperty {
  string key = 1;
  string value = 2;
}

message CloudQueuedPublish {
  string topic_name = 1;
  bytes payload = 2;
  uint32 qos = 3;
  bool retain = 4;
  optional string content_type = 5;
  optional uint32 payload_format_indicator = 6;
  optional uint32 message_expiry_interval = 7;
  optional string response_topic = 8;
  optional bytes correlation_data = 9;
  repeated UserProperty user_properties = 10;

  repeated uint32 subscription_identifier = 11;
  optional uint32 topic_alias = 12;
}

message PinControlRequest {
  string state = 1;
}

message PinControlData {
  uint32 pin = 1;
  string state = 2;
}

message PinControlResponse {
  string status = 1;
  optional string message = 2;
  optional PinControlData data = 3;
}

message StatusReport {
  option (msg_cloud_topic) = "evt/rpc.pb.SystemService/StatusReport";
  uint32 status = 1;
  string name = 2;
  string description = 3;
  string message = 4;
  string topic = 5;
  string action = 6;
  uint32 pin = 7;
  string reason = 8;
}

message BridgeStatus {
  DaemonMetrics metrics = 1;
  BridgeSnapshot bridge = 2;
  repeated ProcessStats process_stats = 3;
  SystemStatus system = 4;
}

message TelemetryReport {
  bytes daemon_metrics_blob = 1 [(telemetry_topic_match) = "Metrics"];
  bytes system_status_blob = 2 [(telemetry_topic_default) = true];
  bytes bridge_snapshot_blob = 3 [(telemetry_topic_match) = "BridgeSnapshot"];
  bytes handshake_snapshot_blob = 4 [(telemetry_topic_match) = "HandshakeSnapshot"];
}

message GenericResponse {
  option (msg_error_init) = "status=\"error\"";
  string status = 1;
  string message = 2;
}

// Linux-side console service. It is not an MCU pw_rpc service: Linux -> MCU
// requests are queued by the daemon and framed on HDLC_ADDRESS_CONSOLE, and
// MCU -> Linux console frames are published on the method's cloud topic.
service ConsoleService {
  rpc Write(rpc.pb.ConsoleWrite) returns (rpc.pb.Empty) {
    option (auth_field) = "console_input";
    option (cloud_topic) = "evt/rpc.pb.ConsoleService/Write";
    option (method_description) = "Console bytes. Linux -> MCU writes are queued and framed on HDLC_ADDRESS_CONSOLE; MCU -> Linux console frames are published on the cloud topic.";
  }
}

message FileTransferSyncRequest {
  string path = 1;
  uint32 resource_id = 2;
}

message FileTransferSyncResponse {
  bool success = 1;
  uint32 bytes_transferred = 2;
  string message = 3;
}

message EepromSyncRequest {}

// Linux-side bridge between the Gateway's EEPROM staging resource and the MCU
// pw_transfer resource EEPROM_TRANSFER_RESOURCE_ID (ADR-0007). Read copies the
// MCU EEPROM image to the Gateway; Write programs the staged image into it.
service EepromService {
  rpc Read(rpc.pb.EepromSyncRequest) returns (rpc.pb.FileTransferSyncResponse) {
    option (auth_field) = "eeprom_read";
    option (method_description) = "Copy the MCU EEPROM image to the Gateway EEPROM staging resource.";
  }
  rpc Write(rpc.pb.EepromSyncRequest) returns (rpc.pb.FileTransferSyncResponse) {
    option (auth_field) = "eeprom_write";
    option (method_description) = "Program the Gateway-staged EEPROM image into the MCU EEPROM.";
  }
}

// Linux-side pw_transfer proxy service. Synchronizes files between the Gateway's
// pw_transfer staging resource and the local OpenWrt Linux filesystem.
service FileTransferService {
  rpc PushToLinux(rpc.pb.FileTransferSyncRequest) returns (rpc.pb.FileTransferSyncResponse) {
    option (auth_field) = "file_write";
    option (method_description) = "Synchronize a staged pw_transfer file from Gateway to local Linux filesystem.";
  }
  rpc FetchFromLinux(rpc.pb.FileTransferSyncRequest) returns (rpc.pb.FileTransferSyncResponse) {
    option (auth_field) = "file_read";
    option (method_description) = "Synchronize a local Linux filesystem file to Gateway pw_transfer staging.";
  }
}
