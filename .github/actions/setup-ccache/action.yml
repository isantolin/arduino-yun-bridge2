name: Setup Ccache
description: Cache native C/C++ compilation results across CI runs.

runs:
  using: composite
  steps:
    - name: Install ccache
      shell: bash
      run: |
        if ! command -v ccache >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y ccache
        fi
        ccache --set-config=max_size=1G
        ccache --set-config=compiler_check=content
        echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
        echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
    - name: Identify native compilers
      id: compiler
      shell: bash
      run: |
        echo "version=$(gcc -dumpfullversion -dumpversion)-$(g++ -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
    - name: Restore native compilation cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ runner.os }}-${{ runner.arch }}-gcc-${{ steps.compiler.outputs.version }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ runner.arch }}-gcc-
    - name: Enable compiler wrappers
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/ccache-bin"
        ln -sf "$(command -v ccache)" "$RUNNER_TEMP/ccache-bin/gcc"
        ln -sf "$(command -v ccache)" "$RUNNER_TEMP/ccache-bin/g++"
        echo "$RUNNER_TEMP/ccache-bin" >> "$GITHUB_PATH"
