[pytest]
minversion = 7.0
addopts = -ra -vv
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
log_cli = true
log_cli_level = INFO
testpaths =
    mcubridge/tests
    mcubridge-client-examples/tests
pythonpath =
    .
    mcubridge
    mcubridge-client-examples
norecursedirs =
    openwrt-sdk
    feeds
    .git
    .tox
    .venv*
    .tmp_tests
    .*
markers =
    fuzz: mark a test as a fuzz test
    timeout: timeout marker accepted during IDE discovery even when pytest-timeout is absent
filterwarnings =
    error
