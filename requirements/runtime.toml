[[dev_dependency]]
name = "coverage"
pip = "coverage==7.16.0"
rationale = "Strict code coverage measurement and reporting tool"

[[dev_dependency]]
name = "pyright"
pip = "pyright==1.1.411"
rationale = "Strict static type checker enforcing zero-warning type safety across the Python stack"

[[dev_dependency]]
name = "ruff"
pip = "ruff==0.16.6"
rationale = "Fast Python linter and code quality validator"

[[dev_dependency]]
name = "mypy-protobuf"
pip = "mypy-protobuf==5.1.0"
rationale = "Protoc plugin for generating strict type stubs (.pyi) from Protobuf definitions"

[[dev_dependency]]
name = "pexpect"
pip = "pexpect==4.9.0"
rationale = "Terminal interaction library for QEMU automation tools"







