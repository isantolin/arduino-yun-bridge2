[tox]
envlist = py, protocol, lint, typecheck, cppcheck, fuzz, gemini-parity, codebase-auditor
isolated_build = false
skipsdist = true

[testenv]
basepython = python3
system_site_packages = true
setenv =
    PYTHONPATH = {toxinidir}/typings:{toxinidir}/typings/stubs:{toxinidir}:{toxinidir}/mcubridge:{toxinidir}/mcubridge-client-examples:{toxinidir}/mcubridge-client-examples/tests:{toxinidir}/mcubridge-gateway
passenv =
    LC_ALL
    LANG
    PATH
    HOME
    HYPOTHESIS_PROFILE
    GITHUB_STEP_SUMMARY
    RENODE_METRICS_DIR
    SIMAVR_METRICS_DIR
    QEMU_METRICS_DIR
    CONSOLIDATE_EMULATION_SUMMARY
allowlist_externals =
    ./tools/ci/ci_arduino_host_tests.sh
    ./tools/ci/compile_emulator.sh
    ./tools/ci/ensure_clang_format.sh
    ./tools/ci/run_clang_tidy.sh
    clang-format
    clang-tidy
    sh
    cat
    xargs
    kill
    rm
    sleep
    pkill
    cppcheck
    black
    ruff
    pyright
    pyrefly
    bash
    protoc
    vulture
    flake8
    buf
    semgrep
deps =
    setuptools==84.2.1
    -r requirements/runtime.txt
    packaging==26.3
    jinja2==3.1.6
    pytest==9.2.0
    pytest-asyncio==1.4.1
    pytest-timeout==2.5.0
    pytest-xdist==3.8.0
    pytest-mock==3.17.0
    hypothesis==6.170.13
    nanopb==0.4.9.1
    tenacity==9.2.1
    vulture==2.16
    flake8==7.4.1
    ruff==0.17.3
    coverage==7.17.0

    prometheus-client==0.26.0
    httpx==0.28.1
    serialx==1.15.1
    cryptography==50.0.2
    mypy-protobuf==5.1.0
    black==26.10.1
    pexpect==4.9.0
    asyncssh==2.24.1
    openwrt-luci-rpc==1.1.17
    pyelftools==0.33
    dirty-equals==0.11
    esprima==4.0.1
    pyyaml==6.0.3

[testenv:protocol]
deps =
    {[testenv]deps}
    black==26.10.1
    pyright==1.1.414
commands =
    python tools/protocol/generate.py --spec tools/protocol/cloud_gateway.proto --py mcubridge/mcubridge/protocol/protocol.py --cpp mcubridge-library-arduino/src/protocol/rpc_protocol.h --cpp-structs mcubridge-library-arduino/src/protocol/rpc_structs.h --py-client mcubridge-client-examples/mcubridge_client/protocol.py

[testenv:lint]
deps =
    {[testenv]deps}
    ruff==0.17.3
    black==26.10.1
    clang-format==22.1.8
    flake8==7.4.1
commands_pre =
    {[testenv:protocol]commands}
commands =
    buf format -d tools/protocol --exit-code
    ./tools/ci/ensure_clang_format.sh
    ./tools/ci/run_clang_tidy.sh
    black .
    ruff check --fix --unsafe-fixes mcubridge mcubridge-client-examples mcubridge-gateway tools mcubridge/scripts
    flake8
    vulture

[testenv:typecheck]
setenv =
    {[testenv]setenv}
    PYRIGHT_PYTHON_FORCE_VERSION = latest
deps =
    {[testenv]deps}
    black==26.10.1
    ruff==0.17.3
    pyright==1.1.414
    pyrefly==1.4.0
    types-protobuf==7.35.1.20260906
    types-psutil==7.2.2.20260906
    types-pexpect==4.9.0.20260518
    types-PyYAML==6.0.12.20260906
    clang-format==22.1.8
commands_pre =
    {[testenv:protocol]commands}
commands =
    black .
    ruff check --fix --unsafe-fixes mcubridge mcubridge-client-examples mcubridge-gateway tools mcubridge/scripts
    pyright
    pyrefly check

[testenv:py]
setenv =
    {[testenv]setenv}
    CONSOLIDATE_EMULATION_SUMMARY = 1
commands_pre =
    {[testenv:protocol]commands}
commands =
    python -m pytest -vv {posargs:-n 5} --timeout=60 --timeout_method=thread --basetemp=.tmp_tests mcubridge/tests mcubridge-client-examples/tests mcubridge-gateway/tests

[testenv:cppcheck]
commands_pre =
    {[testenv:protocol]commands}
    python tools/arduino_core_metadata.py --host-test --write-header build/cppcheck/ArduinoCoreMetadata.h
commands =
    cppcheck --enable=warning,style,performance,portability \
             -i mcubridge-library-arduino/src/pb_common.c \
             -i mcubridge-library-arduino/src/pb_decode.c \
             -i mcubridge-library-arduino/src/pb_encode.c \
             -i mcubridge-library-arduino/src/protocol/config_schema.pb.c \
             -i mcubridge-library-arduino/src/protocol/mcu_wire.pb.c \
             --error-exitcode=1 \
             --std=c++17 -DPROGMEM="" -DPB_PROTO_HEADER_VERSION=40 \
             -DARDUINO_STUB_CUSTOM_MILLIS \
             -I mcubridge-library-arduino/src -I build/cppcheck -I tools/arduino_stub/include \
             mcubridge-library-arduino/src

[testenv:arduino]
commands_pre =
    {[testenv:protocol]commands}
commands =
    ./tools/ci/ci_arduino_host_tests.sh

[testenv:e2e]
setenv =
    {[testenv]setenv}
    MCUBRIDGE_LOG_STREAM = 1
    MCUBRIDGE_NON_INTERACTIVE = 1
commands_pre =
    {[testenv:protocol]commands}
commands =
    ./tools/ci/compile_emulator.sh
    sh -c 'python mcubridge-gateway/gateway.py --no-tls --port 8443 & echo $! > {toxinidir}/.gateway-tox.pid'
    sleep 5
    python tools/emulation/emulation_runner.py --firmware mcubridge-library-arduino/tests/bridge_emulator \
        mcubridge-client-examples/examples/process_test.py \
        mcubridge-client-examples/examples/mailbox_read_test.py \
        mcubridge-client-examples/examples/sensor_reader_test.py \
        mcubridge-client-examples/examples/all_features_test.py \
        mcubridge-client-examples/examples/console_test.py \
        mcubridge-client-examples/examples/datastore_test.py \
        mcubridge-client-examples/examples/fileio_test.py \
        mcubridge-client-examples/examples/led13_test.py \
        mcubridge-client-examples/examples/spi_test.py \
        mcubridge-client-examples/examples/bootloader_test.py
    sh -c 'kill "$(cat {toxinidir}/.gateway-tox.pid)" 2>/dev/null; rm -f {toxinidir}/.gateway-tox.pid'

[testenv:simavr]
allowlist_externals =
    {[testenv]allowlist_externals}
commands_pre =
    {[testenv:protocol]commands}
commands =
    python tools/emulation/simavr_runner.py --sketch mcubridge-library-arduino/examples/CorrectedSmokeTest/CorrectedSmokeTest.ino

[testenv:renode]
allowlist_externals =
    {[testenv]allowlist_externals}
commands_pre =
    {[testenv:protocol]commands}
commands =
    python tools/emulation/renode_runner.py --sketch mcubridge-library-arduino/examples/BridgeControl/BridgeControl.ino

[testenv:qemu-esp32]
allowlist_externals =
    {[testenv]allowlist_externals}
commands_pre =
    {[testenv:protocol]commands}
commands =
    python tools/emulation/qemu_runner.py --sketch mcubridge-library-arduino/examples/BridgeControl/BridgeControl.ino

[testenv:fleet-mesh-hardware]
allowlist_externals =
    {[testenv]allowlist_externals}
commands_pre =
    {[testenv:protocol]commands}
commands =
    python tools/emulation/test_fleet_mesh_hardware_e2e.py


[testenv:luci]
deps =
    esprima==4.0.1
commands =
    python tools/audit/validate_luci.py

[testenv:codebase-auditor]
deps =
    {[testenv]deps}
commands_pre =
    {[testenv:protocol]commands}
commands =
    python tools/audit/codebase_auditor.py
    python tools/audit/audit_test_integrity.py

[testenv:coverage]
setenv =
    {[testenv]setenv}
    CONSOLIDATE_EMULATION_SUMMARY = 1
    PYTHON_COVERAGE_MIN = 95
    PYTHON_COVERAGE_MIN_BRANCH = 95
    ARDUINO_COVERAGE_MIN_LINE = 95
    ARDUINO_COVERAGE_MIN_BRANCH = 95
    ARDUINO_COVERAGE_MIN_FUNCTION = 95
deps =
    {[testenv]deps}
    pytest-cov==7.1.0
    gcovr==8.8
    coverage==7.17.0
allowlist_externals =
    {[testenv]allowlist_externals}
    ./tools/ci/coverage_arduino.sh
    bash
commands_pre =
    {[testenv:protocol]commands}
commands =
    bash -c '{envpython} tools/ci/coverage_python.py & P1=$!; PYTHON_EXE={envpython} ./tools/ci/coverage_arduino.sh & P2=$!; wait $P1; S1=$?; wait $P2; S2=$?; if [ $S1 -ne 0 ]; then exit $S1; elif [ $S2 -ne 0 ]; then exit $S2; else exit 0; fi'

[testenv:arduino-examples]
passenv =
    {[testenv]passenv}
    ARDUINO_METRICS_DIR
allowlist_externals =
    {[testenv]allowlist_externals}
    ./tools/ci/ci_arduino.sh
commands =
    ./tools/ci/ci_arduino.sh {posargs}

[testenv:gemini-parity]
deps =
    {[testenv]deps}
skip_install = true
commands =
    python tools/audit/check_gemini_parity.py

[testenv:fuzz]
commands_pre =
    {[testenv:protocol]commands}
commands =
    python tools/emulation/runner.py --fqbn arduino:avr:uno --fuzz --fuzz-iterations 500

[testenv:deps-sync]
commands =
    python tools/audit/sync_runtime_deps.py --check --check-latest

[testenv:semgrep]
deps =
    semgrep==1.182.1
commands =
    semgrep --config .semgrep.yml --json

