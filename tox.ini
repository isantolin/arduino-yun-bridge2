[tox]
envlist = py313, protocol, lint, typecheck, cppcheck, fuzz, gemini-parity
isolated_build = false
skipsdist = true

[testenv]
sitepackages = true
basepython = python3
setenv =
    PYTHONPATH = {toxinidir}/typings:{toxinidir}/typings/stubs:{toxinidir}:{toxinidir}/mcubridge:{toxinidir}/mcubridge-client-examples:{toxinidir}/mcubridge-gateway
passenv =
    LC_ALL
    LANG
    PATH
    HOME
allowlist_externals =
    ./tools/ci/ci_arduino_host_tests.sh
    ./tools/ci/compile_emulator.sh
    ./tools/ci/ci_fuzz.sh
    ./tools/ci/ensure_clang_format.sh
    clang-format
    sh
    cat
    xargs
    kill
    rm
    sleep
    pkill
    cppcheck
    black
    ruff
    pyright
    bash
    protoc
deps =
    setuptools
    -r requirements/runtime.txt
    packaging
    jinja2
    pytest
    pytest-asyncio
    pytest-timeout
    pytest-xdist
    nanopb
    tenacity

    rich
    prometheus-client
    serialx
    cryptography
    mypy-protobuf
    black

[testenv:protocol]
deps =
    {[testenv]deps}
    black
    pyright
commands =
    python tools/protocol/generate.py --spec tools/protocol/mcubridge.proto --py mcubridge/mcubridge/protocol/protocol.py --cpp mcubridge-library-arduino/src/protocol/rpc_protocol.h --cpp-structs mcubridge-library-arduino/src/protocol/rpc_structs.h --py-client mcubridge-client-examples/mcubridge_client/protocol.py

[testenv:lint]
deps =
    {[testenv]deps}
    ruff
    black
    clang-format
commands_pre =
    {[testenv:protocol]commands}
commands =
    ./tools/ci/ensure_clang_format.sh
    black --target-version py313 .
    ruff check --fix --unsafe-fixes mcubridge mcubridge-client-examples mcubridge-gateway tools mcubridge/scripts
    ruff check mcubridge mcubridge-client-examples mcubridge-gateway tools mcubridge/scripts
    python tools/audit/audit_library_density.py

[testenv:typecheck]
setenv =
    {[testenv]setenv}
    PYRIGHT_PYTHON_FORCE_VERSION = latest
deps =
    {[testenv]deps}
    black
    ruff
    pyright
    clang-format
commands_pre =
    {[testenv:protocol]commands}
commands =
    ./tools/ci/ensure_clang_format.sh
    black --target-version py313 .
    ruff check --fix --unsafe-fixes mcubridge mcubridge-client-examples mcubridge-gateway tools mcubridge/scripts
    pyright

[testenv:py313]
commands_pre =
    {[testenv:protocol]commands}
commands =
    python -m pytest -vv {posargs:-n 5} --basetemp=.tmp_tests mcubridge/tests mcubridge-client-examples/tests mcubridge-gateway/tests

[testenv:cppcheck]
commands_pre =
    {[testenv:protocol]commands}
commands =
    cppcheck --enable=warning,style,performance,portability \
             -i mcubridge-library-arduino/src/pb_common.c \
             -i mcubridge-library-arduino/src/pb_decode.c \
             -i mcubridge-library-arduino/src/pb_encode.c \
             -i mcubridge-library-arduino/src/protocol/mcubridge.pb.c \
             --error-exitcode=1 \
             --std=c++17 -DPROGMEM="" -DPB_PROTO_HEADER_VERSION=40 -I mcubridge-library-arduino/src \
             mcubridge-library-arduino/src mcubridge-library-arduino/src

[testenv:arduino]
commands_pre =
    {[testenv:protocol]commands}
commands =
    ./tools/ci/ci_arduino_host_tests.sh

[testenv:e2e]
setenv =
    {[testenv]setenv}
    MCUBRIDGE_LOG_STREAM = 1
    MCUBRIDGE_SOCKET_PATH = {envtmpdir}/mcubridge.sock
commands_pre =
    {[testenv:protocol]commands}
commands =
    ./tools/ci/compile_emulator.sh
    sh -c 'python mcubridge-gateway/gateway.py --no-tls --port 8443 & echo $! > {toxinidir}/.gateway-tox.pid'
    sleep 5
    python tools/emulation/emulation_runner.py --firmware mcubridge-library-arduino/tests/bridge_emulator \
        mcubridge-client-examples/examples/process_test.py \
        mcubridge-client-examples/examples/mailbox_read_test.py \
        mcubridge-client-examples/examples/sensor_reader_test.py \
        mcubridge-client-examples/examples/all_features_test.py \
        mcubridge-client-examples/examples/console_test.py \
        mcubridge-client-examples/examples/datastore_test.py \
        mcubridge-client-examples/examples/fileio_test.py \
        mcubridge-client-examples/examples/led13_test.py \
        mcubridge-client-examples/examples/bootloader_test.py \
        mcubridge-client-examples/examples/spi_test.py
    sh -c 'kill "$(cat {toxinidir}/.gateway-tox.pid)" 2>/dev/null; rm -f {toxinidir}/.gateway-tox.pid'

[testenv:simavr]
passenv =
    {[testenv]passenv}
    GITHUB_STEP_SUMMARY
    SIMAVR_METRICS_DIR
setenv =
    {[testenv]setenv}
    MCUBRIDGE_LOG_STREAM = 1
    MCUBRIDGE_SOCKET_PATH = {envtmpdir}/mcubridge.sock
allowlist_externals =
    {[testenv]allowlist_externals}
    ./tools/ci/ci_simavr_matrix.sh
commands_pre =
    {[testenv:protocol]commands}
commands =
    ./tools/ci/ci_simavr_matrix.sh

[testenv:deps-sync]
commands =
    python tools/audit/sync_runtime_deps.py --check --check-latest

[testenv:luci]
deps =
commands =
    python tools/audit/validate_luci.py

[testenv:coverage]
setenv =
    {[testenv]setenv}
    PYTHON_COVERAGE_MIN = 95
    PYTHON_COVERAGE_MIN_BRANCH = 95
    ARDUINO_COVERAGE_MIN_LINE = 95
    ARDUINO_COVERAGE_MIN_BRANCH = 95
deps =
    {[testenv]deps}
    pytest-cov
    gcovr
    coverage==7.16.0
allowlist_externals =
    {[testenv]allowlist_externals}
    ./tools/ci/coverage_python.sh
    ./tools/ci/coverage_arduino.sh
    bash
commands_pre =
    {[testenv:protocol]commands}
commands =
    bash -c 'PYTHON_EXE={envpython} ./tools/ci/coverage_python.sh & P1=$!; PYTHON_EXE={envpython} ./tools/ci/coverage_arduino.sh & P2=$!; wait $P1; S1=$?; wait $P2; S2=$?; if [ $S1 -ne 0 ]; then exit $S1; elif [ $S2 -ne 0 ]; then exit $S2; else exit 0; fi'

[testenv:arduino-examples]
passenv =
    {[testenv]passenv}
    ARDUINO_METRICS_DIR
allowlist_externals =
    {[testenv]allowlist_externals}
    ./tools/ci/ci_arduino.sh
commands =
    ./tools/ci/ci_arduino.sh {posargs}

[testenv:gemini-parity]
deps =
    {[testenv]deps}
skip_install = true
commands =
    python tools/audit/check_gemini_parity.py

[testenv:fuzz]
commands_pre =
    {[testenv:protocol]commands}
commands =
    ./tools/ci/ci_fuzz.sh
