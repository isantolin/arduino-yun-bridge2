[pytest]
minversion = 7.0
addopts = -ra -vv --timeout=60 --timeout_method=thread
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
log_cli = true
log_cli_level = INFO
testpaths =
    mcubridge/tests
    mcubridge-client-examples/tests
    mcubridge-gateway/tests
pythonpath =
    .
    mcubridge
    mcubridge-client-examples
    mcubridge-gateway
norecursedirs =
    openwrt-sdk
    feeds
    .git
    .tox
    .venv*
    .tmp_tests
    .*
markers =
    fuzz: mark a test as a fuzz test
    timeout: timeout marker accepted during IDE discovery even when pytest-timeout is absent
    xdist_group: mark test to run in an isolated xdist worker group
filterwarnings =
    error
