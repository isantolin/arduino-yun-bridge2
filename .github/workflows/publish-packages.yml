name: Publish Python Package to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-python-wheel:
    name: Publish Python Wheel to GitHub Packages
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install System Dependencies & protoc
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          PROTOC_VERSION=36.0
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
          curl -OL https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}
          sudo unzip -o ${PROTOC_ZIP} -d /usr/local
          rm -f ${PROTOC_ZIP}
          protoc --version
          python -m pip install --upgrade pip build twine setuptools wheel protobuf nanopb jinja2 typer black mypy-protobuf grpclib packaging

      - name: Generate Protocol Bindings
        run: |
          python tools/protocol/generate.py \
            --spec tools/protocol/mcubridge.proto \
            --py mcubridge/mcubridge/protocol/protocol.py \
            --cpp mcubridge-library-arduino/src/protocol/rpc_protocol.h \
            --cpp-structs mcubridge-library-arduino/src/protocol/rpc_structs.h \
            --py-client mcubridge-client-examples/mcubridge_client/protocol.py

      - name: Build Python Package (sdist & wheel)
        run: python -m build

      - name: Publish to GitHub Packages PyPI
        env:
          TWINE_USERNAME: ${{ github.actor }}
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          twine upload --repository-url https://pypi.pkg.github.com/${{ github.repository_owner }} dist/* --skip-existing
