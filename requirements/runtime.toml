# Single source of truth for McuBridge daemon dependencies.

[[dependency]]
name = "python3"
openwrt = "python3"
pip = ""
gateway = true
rationale = "Base interpreter shipped on the target image"




[[dependency]]
name = "python-cobs"
openwrt = "python3-cobs"
pip = "cobs==1.2.2"
rationale = "COBS framing for the RPC protocol"


[[dependency]]
name = "jinja2"
openwrt = "python3-jinja2"
pip = "jinja2==3.1.6"
rationale = "Template engine for professional and auditable code generation [BUILD-ONLY]"


[[dependency]]
name = "protobuf"
openwrt = "python3-protobuf"
pip = "protobuf==7.36.0rc2"
gateway = true
rationale = "Generated protobuf runtime required for daemon and Cloud payload serialization [RELEASE CANDIDATE v36.0-rc1: Edition 2026 naming & UPB performance features]"


[[dependency]]
name = "prometheus-client"
openwrt = "python3-prometheus-client"
pip = "prometheus-client==0.26.0"
rationale = "Expose runtime metrics via the Prometheus Python client"

[[dependency]]
name = "serialx"
openwrt = "python3-serialx"
pip = "serialx==1.8.2"
rationale = "Native sync/async serial stack with modem-pin controls and typed transports"

[[dependency]]
name = "tenacity"
openwrt = "python3-tenacity"
pip = "tenacity==9.1.4"
rationale = "Declarative retrying library for robust task supervision and handshake"

[[dependency]]
name = "uvloop"
openwrt = "python3-uvloop"
pip = "uvloop==0.22.1"
rationale = "Ultra-fast asyncio event loop implementation (libuv)"

[[dependency]]
name = "cryptography"
openwrt = "python3-cryptography"
pip = "cryptography==50.0.0"
rationale = "HKDF and HMAC for handshake security (SIL-2 compliance)"

[[dependency]]
name = "structlog"
openwrt = "python3-structlog"
pip = "structlog==26.1.0"
rationale = "Structured logging with JSON output for production syslog"



[[dependency]]
name = "xxd"
openwrt = "xxd"
pip = ""
rationale = "Hex-dump utility used by diagnostic scripts [BUILD-ONLY]"


[[dependency]]
name = "h2"
openwrt = "python3-h2"
pip = "h2==4.4.1"
gateway = true
rationale = "Pure Python HTTP/2 protocol implementation for grpclib"


[[dependency]]
name = "grpclib"
openwrt = "python3-grpclib"
pip = "grpclib==0.4.9"
gateway = true
rationale = "Pure Python asyncio gRPC library for MPU-to-Cloud communication"

[[dependency]]
name = "typer"
openwrt = "python3-typer"
pip = "typer>=0.27.0"
gateway = true
rationale = "Declarative CLI application builder for MPU diagnostic utilities and Gateway CLI"

[[dependency]]
name = "protovalidate"
openwrt = "python3-protovalidate"
pip = "protovalidate==1.2.0"
rationale = "Declarative protobuf message validator (buf.validate) replacing protoc-gen-validate, which is broken with modern protobuf/upb runtimes; enforces schema-driven SIL-2 constraints"

[[dependency]]
name = "cel-python"
openwrt = "python3-cel-python"
pip = "cel-python==0.5.0"
rationale = "Transitive dependency of protovalidate required to evaluate CEL (Common Expression Language) constraint expressions"

[[dependency]]
name = "google-re2"
openwrt = "python3-google-re2"
pip = "google-re2==1.1.20251105"
rationale = "Mandatory dependency of cel-python (unconditional 'import re2') used for RE2 regex evaluation in CEL string constraints"

[[dependency]]
name = "lark"
openwrt = "python3-lark"
pip = "lark==1.3.1"
rationale = "Mandatory dependency of cel-python (unconditional 'import lark') used to parse the CEL grammar"

[[dependency]]
name = "pendulum"
openwrt = "python3-pendulum"
pip = "pendulum==3.2.0"
rationale = "Mandatory dependency of cel-python (unconditional 'import pendulum') used for CEL timestamp/duration type evaluation"

[[dependency]]
name = "tzdata"
openwrt = "python3-tzdata"
pip = "tzdata==2026.3"
rationale = "Transitive dependency of pendulum providing the IANA time zone database"

[[dependency]]
name = "black"
openwrt = "python3-black"
pip = "black==26.5.1"
rationale = "PEP 8 canonical code formatter required for generated code and development environments [BUILD-ONLY]"

[[dependency]]
name = "nanopb"
openwrt = "nanopb"
pip = "nanopb==0.4.9.1"
rationale = "Zero-heap C protobuf generator and runtime library [BUILD-ONLY]"

[[dependency]]
name = "grpcio-tools"
openwrt = "python3-grpcio-tools"
pip = "grpcio-tools==1.83.0"
rationale = "Protobuf and gRPC stubs compiler for code generation [BUILD-ONLY]"

[[dependency]]
name = "lmdb"
openwrt = "python3-lmdb"
pip = "lmdb==2.3.0"
rationale = "Ultra-fast memory-mapped C storage engine for persistent queues and key-value datastores"

[[dependency]]
name = "packaging"
openwrt = "python3-packaging"
pip = "packaging>=24.0"
rationale = "Standardized core utilities for Python package version parsing and requirement specifiers"

[[dependency]]
name = "distlib"
openwrt = "python3-distlib"
pip = "distlib>=0.3.8"
rationale = "Low-level distribution and packaging utilities for version normalization and dependency resolution"


# =============================================================================
# C++ / Arduino Microcontroller Dependencies (SIL-2 Zero-Heap)
# =============================================================================

[[cpp_dependency]]
name = "Embedded_Template_Library"
github = "ETLCPP/etl"
ref_type = "tags"
version = "20.48.1"
check_file = "include/etl/algorithm.h"
rationale = "Zero-heap, STL-free deterministic C++ template library for SIL-2 MCU algorithms"

[[cpp_dependency]]
name = "wolfSSL"
github = "wolfSSL/wolfssl"
ref_type = "tags"
version = "v5.9.2-stable"
check_file = "wolfssl/wolfcrypt/settings.h"
rationale = "FIPS 140-3 / SIL-2 compliant cryptography engine (ChaCha20-Poly1305, HKDF, SHA-256)"

[[cpp_dependency]]
name = "PacketSerial"
github = "isantolin/PacketSerial2"
ref_type = "heads"
version = "master"
check_file = "src/Codecs/COBSR.h"
rationale = "COBS/R framing and packet encoder/decoder for serial stream synchronization"

[[cpp_dependency]]
name = "Unity"
github = "ThrowTheSwitch/Unity"
ref_type = "tags"
version = "v2.7.0"
check_file = "unity.h"
target_dir = "tests"
rationale = "Host-based deterministic C/C++ unit testing harness for MCU components"

[[cpp_dependency]]
name = "nanopb_core"
github = "nanopb/nanopb"
ref_type = "version"
version = "0.4.9.1"
check_file = "pb.h"
rationale = "Lightweight zero-heap C Protobuf serialization runtime for embedded MCUs"


# =============================================================================
# Development, Linting and Verification Tooling (CI/Dev SSOT)
# =============================================================================

[[dev_dependency]]
name = "coverage"
pip = "coverage==7.15.4"
rationale = "Strict code coverage measurement and reporting tool"

[[dev_dependency]]
name = "pyright"
pip = "pyright==1.1.411"
rationale = "Strict static type checker enforcing zero-warning type safety across the Python stack"

[[dev_dependency]]
name = "ruff"
pip = "ruff==0.16.3"
rationale = "Fast Python linter and code quality validator"

[[dev_dependency]]
name = "mypy-protobuf"
pip = "mypy-protobuf==5.1.0"
rationale = "Protoc plugin for generating strict type stubs (.pyi) from Protobuf definitions"







