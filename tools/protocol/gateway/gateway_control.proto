syntax = "proto3";

package mcubridge.gateway;

// Northbound control RPCs. Only a peer authenticated with the
// spiffe://mcubridge/client/<principal> URI SAN may invoke this service.
message HealthRequest {}

message HealthResponse {
  bool ready = 1;
  uint32 active_device_sessions = 2;
  uint32 active_client_sessions = 3;
}

// `operation` is the canonical operation name "<proto service>/<method>", for
// example "rpc.pb.GpioService/DigitalWrite". It is forwarded verbatim from the
// northbound client to the edge daemon, which resolves it in its catalog.
message DispatchRequest {
  reserved 2, 3;
  reserved "service_name", "method_name";
  string target_device_id = 1;
  string operation = 6;
  bytes request_payload = 4;
  uint32 timeout_ms = 5;
}

message DispatchResponse {
  uint32 status_code = 1;
  bytes response_payload = 2;
}

message EdgeDispatchRequest {
  reserved 1, 2;
  reserved "service_name", "method_name";
  string operation = 5;
  bytes request_payload = 3;
  uint32 timeout_ms = 4;
}

message EdgeDispatchResponse {
  uint32 status_code = 1;
  bytes response_payload = 2;
}

message TelemetryReport {
  bytes daemon_metrics_blob = 1;
  bytes system_status_blob = 2;
  bytes bridge_snapshot_blob = 3;
  bytes handshake_snapshot_blob = 4;
}

message TelemetryResponse {
  bool acknowledged = 1;
}

service GatewayControl {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Dispatch(DispatchRequest) returns (DispatchResponse);
}

service DeviceTelemetry {
  rpc ReportTelemetry(TelemetryReport) returns (TelemetryResponse);
}

service EdgeControl {
  rpc Dispatch(EdgeDispatchRequest) returns (EdgeDispatchResponse);
}
