name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HYPOTHESIS_PROFILE: ci

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1: Fast Checks & Unit Tests (Matrix)
  # ═══════════════════════════════════════════════════════════════════════════
  tox-checks:
    name: Tox (${{ matrix.env }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        env: [protocol, deps-sync, luci, cppcheck, typecheck, lint, codebase-auditor, py, arduino]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-protoc
      - uses: ./.github/actions/setup-python-tox
        with:
          install-system-deps: 'true'
          cache-suffix: ${{ matrix.env }}
      - name: Install System Dependencies
        if: matrix.env == 'cppcheck' || matrix.env == 'typecheck' || matrix.env == 'protocol' || matrix.env == 'lint' || matrix.env == 'py' || matrix.env == 'codebase-auditor' || matrix.env == 'arduino'
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck unzip clang-tidy
          sudo npm install -g --allow-scripts=@bufbuild/buf @bufbuild/buf
          python -m pip install semgrep protobuf mypy-protobuf vulture pytest pyrefly types-protobuf types-psutil types-pexpect flake8 ruff pyelftools
      - name: Install Build Tools
        if: matrix.env == 'arduino'
        run: sudo apt-get update && sudo apt-get install -y g++ make
      - name: Install Arduino CLI and AVR core metadata
        if: matrix.env == 'cppcheck' || matrix.env == 'lint' || matrix.env == 'arduino'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$GITHUB_WORKSPACE/bin" sh
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Check for Hardcoded Secrets
        if: matrix.env == 'lint'
        run: |
          echo "Checking for hardcoded secrets..."
          set +e
          secret_scan_output=$(grep -r -n "serial_shared_secret.*=.*['\"][^'\"]\{8,\}['\"]" mcubridge/uci-defaults/)
          secret_scan_status=$?
          set -e
          if [ "$secret_scan_status" -gt 1 ]; then
            echo "::error::Failed to scan mcubridge/uci-defaults for hardcoded secrets."
            exit "$secret_scan_status"
          fi
          if [ "$secret_scan_status" -eq 0 ]; then
            set +e
            filtered_secret_output=$(printf '%s\n' "$secret_scan_output" | grep -v "6368616e67656d65313233" | grep -v '""' | grep -v "''")
            filtered_secret_status=$?
            set -e
            if [ "$filtered_secret_status" -gt 1 ]; then
              echo "::error::Failed to filter secret scan results."
              exit "$filtered_secret_status"
            fi
            if [ "$filtered_secret_status" -eq 0 ]; then
              printf '%s\n' "$filtered_secret_output"
              echo "::error::Hardcoded secret found!"
              exit 1
            fi
          fi
          echo "✅ No hardcoded secrets"
      - name: Run Tox Environment
        run: tox -e ${{ matrix.env }}

  arduino-examples:
    name: Arduino Examples Compilation
    runs-on: ubuntu-26.04
    needs: [tox-checks]
    timeout-minutes: 15
    env:
      ARDUINO_METRICS_DIR: arduino-logs
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-protoc
      - name: Setup Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH
      - name: Install Arduino Cores and Dependencies
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr arduino:samd arduino:esp32
          arduino-cli lib install "Embedded Template Library ETL"
          arduino-cli lib install WiFiNINA
      - uses: ./.github/actions/setup-python-tox
        with:
          cache-suffix: arduino-examples
      - name: Install ESP32 build dependency
        run: python -m pip install pyserial
      - name: Compile Examples
        run: |
          mkdir -p arduino-build
          tox -e arduino-examples -- arduino-build
      - name: Profile Memory Usage
        if: always()
        run: |
          mkdir -p arduino-logs
          PYTHONPATH=. python tools/profiling/arduino_symbol_profiler.py arduino-build --output arduino-logs/symbol_profile.md
      - name: Upload Arduino Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arduino-logs
          path: arduino-logs
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 2: Tests (after fast checks pass) - ~10min total
  # ═══════════════════════════════════════════════════════════════════════════
  unified-tests:
    name: Unified Host Tests & Coverage
    runs-on: ubuntu-26.04
    needs: [tox-checks]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-protoc
      - uses: ./.github/actions/setup-python-tox
        with:
          cache-suffix: coverage
      - name: Install Build Tools
        run: |
          sudo apt-get update && sudo apt-get install -y g++ make
      - name: Setup Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH
      - name: Install Arduino Dependencies
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install "Embedded Template Library ETL"
      - name: Run All Tests with Coverage
        run: tox -e coverage
      - name: Upload Python Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python
          path: coverage/python
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload Arduino Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-arduino-host
          path: coverage/arduino
          if-no-files-found: ignore

  arduino-emulation:
    name: Arduino Emulation (${{ matrix.name }})
    runs-on: ubuntu-26.04
    needs: [tox-checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Full Firmware
            firmware: mcubridge-library-arduino/tests/bridge_emulator
            scripts: >-
              mcubridge-client-examples/tests/test_smoke_connection.py
              mcubridge-client-examples/examples/led13_test.py
              mcubridge-client-examples/examples/console_test.py
              mcubridge-client-examples/examples/datastore_test.py
              mcubridge-client-examples/examples/fileio_test.py
              mcubridge-client-examples/examples/process_test.py
              mcubridge-client-examples/examples/mailbox_read_test.py
              mcubridge-client-examples/examples/sensor_reader_test.py
              mcubridge-client-examples/examples/all_features_test.py
              mcubridge-client-examples/examples/spi_test.py
              mcubridge-client-examples/tests/test_gateway_northbound.py
          - name: Control Sketch
            firmware: mcubridge-library-arduino/tests/bridge_control_emulator
            scripts: >-
              mcubridge-client-examples/tests/test_smoke_connection.py
              mcubridge-client-examples/examples/led13_test.py
              mcubridge-client-examples/examples/console_test.py
              mcubridge-client-examples/examples/mailbox_read_test.py
              mcubridge-client-examples/tests/test_gateway_northbound.py
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-protoc
      - uses: ./.github/actions/setup-python-tox
        with:
          cache-suffix: emulation
      - name: Install Python Dependencies
        run: pip install -r requirements/runtime.txt -r mcubridge-gateway/requirements.txt nanopb black
      - name: Install Emulation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ socat
      - name: Install Arduino CLI and AVR core metadata
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$GITHUB_WORKSPACE/bin" sh
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Install Arduino Dependencies
        run: |
          ./mcubridge-library-arduino/tools/install.sh
      - name: Compile & Run Emulation
        run: |
          ./tools/ci/compile_emulator.sh
          PYTHONPATH=.:mcubridge:mcubridge-client-examples:mcubridge-gateway python -u tools/emulation/emulation_runner.py \
            --firmware ${{ matrix.firmware }} \
            ${{ matrix.scripts }}

  protocol-fuzzing:
    name: Protocol Stress Test (Fuzzing)
    runs-on: ubuntu-26.04
    needs: [tox-checks]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-protoc
      - uses: ./.github/actions/setup-python-tox
        with:
          cache-suffix: fuzz
      - name: Install Emulation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ socat
      - name: Install Arduino CLI and AVR core
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$GITHUB_WORKSPACE/bin" sh
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Run Fuzzing Campaign
        run: tox -e fuzz

  simavr-emulation:
    name: simavr AVR Emulation (Multi-Board Matrix)
    runs-on: ubuntu-26.04
    needs: [tox-checks]
    timeout-minutes: 15
    env:
      SIMAVR_METRICS_DIR: simavr-logs
      CONSOLIDATE_EMULATION_SUMMARY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-protoc
      - uses: ./.github/actions/setup-python-tox
        with:
          cache-suffix: simavr
      - name: Setup Arduino CLI & Tools
        run: |
          sudo apt-get update && sudo apt-get install -y simavr libsimavr-dev socat
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH
      - name: Install Arduino AVR Core & Libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install wolfSSL
      - name: Run simavr E2E Test Suite
        run: |
          mkdir -p simavr-logs
          tox -e simavr
      - name: Upload simavr Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simavr-logs
          path: simavr-logs
          if-no-files-found: ignore

  renode-emulation:
    name: Renode ARM Emulation (Arduino MKR WiFi 1010)
    runs-on: ubuntu-26.04
    needs: [tox-checks]
    timeout-minutes: 15
    env:
      RENODE_METRICS_DIR: renode-logs
      CONSOLIDATE_EMULATION_SUMMARY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-protoc
      - uses: ./.github/actions/setup-python-tox
        with:
          cache-suffix: renode
      - name: Setup Arduino CLI & Tools
        run: |
          sudo apt-get update && sudo apt-get install -y socat
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH
      - name: Install Arduino SAMD Core & Libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:samd
          arduino-cli lib install wolfSSL WiFiNINA
      - name: Install Renode
        run: |
          RENODE_URL="https://dl.antmicro.com/projects/renode/builds/renode-latest.linux-portable.tar.gz"
          if curl -fsSL -o /tmp/renode.tar.gz "$RENODE_URL"; then
            sudo mkdir -p /opt/renode
            sudo tar -xzf /tmp/renode.tar.gz -C /opt/renode --strip-components=1
            echo "/opt/renode" >> "$GITHUB_PATH"
            rm -f /tmp/renode.tar.gz
          else
            echo "::warning::Failed to download Renode package. Fallback to skip mode."
          fi
      - name: Run Renode E2E Test Suite
        run: |
          mkdir -p renode-logs
          tox -e renode
      - name: Upload Renode Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renode-logs
          path: renode-logs
          if-no-files-found: ignore

  qemu-esp32-emulation:
    name: QEMU Xtensa Emulation (Arduino Nano ESP32)
    runs-on: ubuntu-26.04
    needs: [tox-checks]
    timeout-minutes: 15
    env:
      QEMU_METRICS_DIR: qemu-logs
      CONSOLIDATE_EMULATION_SUMMARY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-protoc
      - uses: ./.github/actions/setup-python-tox
        with:
          cache-suffix: qemu-esp32
      - name: Setup Arduino CLI & Tools
        run: |
          sudo apt-get update && sudo apt-get install -y socat libgcrypt20 libpixman-1-0 libsdl2-2.0-0 libslirp0
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH
      - name: Install Arduino ESP32 Core & Tools
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:esp32
          arduino-cli lib install wolfSSL
          python -m pip install pyserial esptool
      - name: Cache Espressif QEMU
        id: cache-qemu-esp32
        uses: actions/cache@v6
        with:
          path: /opt/qemu-esp32
          key: qemu-xtensa-softmmu-9.2.2-20260417-x86_64
      - name: Install Espressif QEMU
        if: steps.cache-qemu-esp32.outputs.cache-hit != 'true'
        run: |
          QEMU_URL="https://github.com/espressif/qemu/releases/download/esp-develop-9.2.2-20260417/qemu-xtensa-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz"
          if curl -fsSL -o /tmp/qemu-esp32.tar.xz "$QEMU_URL"; then
            sudo mkdir -p /opt/qemu-esp32
            sudo tar -xf /tmp/qemu-esp32.tar.xz -C /opt/qemu-esp32 --strip-components=1
            rm -f /tmp/qemu-esp32.tar.xz
          else
            echo "::warning::Failed to download Espressif QEMU. Fallback to skip mode."
          fi
      - name: Add QEMU to PATH
        run: |
          if [ -d "/opt/qemu-esp32/bin" ]; then
            echo "/opt/qemu-esp32/bin" >> "$GITHUB_PATH"
          fi
      - name: Run QEMU ESP32-S3 E2E Test Suite
        run: |
          mkdir -p qemu-logs
          tox -e qemu-esp32
      - name: Upload QEMU Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-logs
          path: qemu-logs
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 3: Consolidation - ~2min
  # ═══════════════════════════════════════════════════════════════════════════
  coverage-report:
    name: Final Summary
    runs-on: ubuntu-26.04
    needs: [unified-tests, arduino-examples, arduino-emulation, protocol-fuzzing, simavr-emulation, renode-emulation, qemu-esp32-emulation]
    if: always()
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-protoc
      - uses: ./.github/actions/setup-python-tox
        with:
          cache-suffix: summary

      - name: Download Python Coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-python
          path: coverage/python
        continue-on-error: true

      - name: Download Arduino Coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-arduino-host
          path: coverage/arduino
        continue-on-error: true

      - name: Download Arduino Logs
        uses: actions/download-artifact@v8
        with:
          name: arduino-logs
          path: arduino-logs
        continue-on-error: true

      - name: Download simavr Logs
        uses: actions/download-artifact@v8
        with:
          name: simavr-logs
          path: simavr-logs
        continue-on-error: true

      - name: Download Renode Logs
        uses: actions/download-artifact@v8
        with:
          name: renode-logs
          path: renode-logs
        continue-on-error: true

      - name: Download QEMU Logs
        uses: actions/download-artifact@v8
        with:
          name: qemu-logs
          path: qemu-logs
        continue-on-error: true

      - name: Verify Artifacts
        run: |
          echo "### Artifact Verification"
          ls -R
          if [ -d "arduino-logs" ]; then
            echo "Contents of arduino-logs:"
            ls -la arduino-logs/
          fi
          if [ -d "simavr-logs" ]; then
            echo "Contents of simavr-logs:"
            ls -la simavr-logs/
          fi
          if [ -d "renode-logs" ]; then
            echo "Contents of renode-logs:"
            ls -la renode-logs/
          fi
          if [ -d "qemu-logs" ]; then
            echo "Contents of qemu-logs:"
            ls -la qemu-logs/
          fi

      - name: Generate Coverage Summary
        run: |
          python -m pip install --upgrade pip setuptools
          pip install coverage
          echo "## 📊 Test & Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/python/.coverage ]; then
            echo "### 🐍 Python Coverage (coverage.py native)" >> "$GITHUB_STEP_SUMMARY"
            coverage report --data-file=coverage/python/.coverage --format=markdown --fail-under=0 --ignore-errors >> "$GITHUB_STEP_SUMMARY" || true
          fi
          if [ -f coverage/arduino/summary.txt ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### ⚡ Arduino MCU C++ Coverage (gcovr)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat coverage/arduino/summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate Memory & Hardware Emulation Summary
        run: |
          # 1. Advanced Symbol Profiling (cat pre-generated report via pyelftools)
          if [ -f arduino-logs/symbol_profile.md ]; then
            cat arduino-logs/symbol_profile.md >> "$GITHUB_STEP_SUMMARY"
          fi

          # 2. Consolidated Multi-Architecture Hardware Emulation Matrix
          python tools/ci/consolidate_emulation_summary.py \
            --simavr-dir simavr-logs \
            --renode-dir renode-logs \
            --qemu-dir qemu-logs

      - name: Generate Daemon Profile
        env:
          PYTHONPATH: .:mcubridge:mcubridge-client-examples:typings
        run: |
          # 1. Mandatory Protocol Generation (Required for imports)
          pip install jinja2 nanopb black httpx
          python tools/protocol/generate.py \
            --spec tools/protocol/cloud_gateway.proto \
            --py mcubridge/mcubridge/protocol/protocol.py \
            --py-client mcubridge-client-examples/mcubridge_client/protocol.py

          # 2. Performance benchmark
          python tools/profiling/benchmark_performance.py \
           --iterations 2000 \
           --json coverage/protocol-benchmark.json

          # 3. Native Python import time profiling
          echo "### ⏱️ Python Import Time Profile" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -X importtime -c "import mcubridge" 2>&1 | tail -n 25 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Combined Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-combined
          path: coverage/
          include-hidden-files: true
          if-no-files-found: ignore
