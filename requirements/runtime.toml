# Single source of truth for McuBridge daemon dependencies.

[[dependency]]
name = "python3"
openwrt = "python3"
pip = ""
gateway = true
rationale = "Base interpreter shipped on the target image"


[[dependency]]
name = "pigweed"
openwrt = "python3-pigweed"
pip = "pigweed==0.0.24"
rationale = "Google Pigweed RPC, HDLC framing, and tokenizer for MCU-MPU transport"


[[dependency]]
name = "jinja2"
openwrt = "python3-jinja2"
pip = "jinja2==3.1.6"
rationale = "Template engine for professional and auditable code generation [BUILD-ONLY]"


[[dependency]]
name = "protobuf"
openwrt = "python3-protobuf"
pip = "protobuf==5.28.3"
check_latest = false
gateway = true
rationale = "Pinned to protobuf 5.28.3 commanded by Google Pigweed priority (pigweed 0.0.24 requires protobuf~=5.28.2)"


[[dependency]]
name = "prometheus-client"
openwrt = "python3-prometheus-client"
pip = "prometheus-client==0.26.0"
gateway = true
edge = false
rationale = "Expose fleet-wide runtime metrics via the Prometheus Python client on mcubridge-gateway"

[[dependency]]
name = "pyserial"
openwrt = "python3-pyserial"
pip = "pyserial==3.5"
check_latest = false
rationale = "Cross-platform serial communication engine commanded by Google Pigweed"


[[dependency]]
name = "tenacity"
openwrt = "python3-tenacity"
pip = "tenacity==9.2.1"
gateway = true
rationale = "Declarative retrying library for robust task supervision and handshake"

[[dependency]]
name = "uvloop"
openwrt = "python3-uvloop"
pip = "uvloop==0.23.0"
gateway = true
rationale = "Ultra-fast asyncio event loop implementation (libuv)"

[[dependency]]
name = "cryptography"
openwrt = "python3-cryptography"
pip = "cryptography==50.0.2"
rationale = "ChaCha20-Poly1305 frame protection and HKDF/HMAC handshake security"

[[dependency]]
name = "structlog"
openwrt = "python3-structlog"
pip = "structlog==26.1.0"
gateway = true
rationale = "Structured logging with JSON output for production syslog"

[[dependency]]
name = "psutil"
openwrt = "python3-psutil"
pip = "psutil==7.2.2"
rationale = "Cross-platform process supervision and resource tracking [SIL-2 compliance]"

[[dependency]]
name = "python-statemachine"
openwrt = "python3-statemachine"
pip = "python-statemachine==3.2.2"
gateway = true
rationale = "Deterministic finite state machine (FSM) implementation matching SIL-2 MCU architecture"

[[dependency]]
name = "anyio"
openwrt = "python3-anyio"
pip = "anyio==4.16.0"
gateway = true
rationale = "Asynchronous file I/O (anyio.Path), structured concurrency, and typed memory streams"

[[dependency]]
name = "parse"
openwrt = "python3-parse"
pip = "parse==1.22.4"
gateway = true
rationale = "Declarative topic path parsing and compilation (SIL-2)"

[[dependency]]
name = "ubus"
openwrt = "python3-ubus"
pip = ""
rationale = "Native OpenWrt microbus RPC interface for LuCI and system integration"


[[dependency]]
name = "xxd"
openwrt = "xxd"
pip = ""
rationale = "Hex-dump utility used by diagnostic scripts [BUILD-ONLY]"


[[dependency]]
name = "hpack"
openwrt = "python3-hpack"
pip = "hpack==4.2.0"
gateway = true
rationale = "Pure-Python HTTP/2 header encoding (HPACK) logic required by h2"


[[dependency]]
name = "hyperframe"
openwrt = "python3-hyperframe"
pip = "hyperframe==6.1.0"
gateway = true
rationale = "HTTP/2 framing layer required by h2"


[[dependency]]
name = "h2"
openwrt = "python3-h2"
pip = "h2==4.4.1"
gateway = true
rationale = "Pure Python HTTP/2 protocol implementation for grpclib"


[[dependency]]
name = "grpclib"
openwrt = "python3-grpclib"
pip = "grpclib==0.4.9"
gateway = true
rationale = "Pure Python asyncio gRPC library for MPU-to-Cloud communication"

[[dependency]]
name = "annotated-doc"
openwrt = "python3-annotated-doc"
pip = "annotated-doc==0.0.6"
gateway = true
rationale = "Doc docstrings extraction runtime required by Typer"

[[dependency]]
name = "shellingham"
openwrt = "python3-shellingham"
pip = "shellingham==1.5.4"
gateway = true
rationale = "Shell environment detection runtime required by Typer"

[[dependency]]
name = "typer"
openwrt = "python3-typer"
pip = "typer==0.29.0"
gateway = true
rationale = "Declarative CLI application builder for MPU diagnostic utilities and Gateway CLI"

[[dependency]]
name = "black"
openwrt = "python3-black"
pip = "black==26.10.1"
rationale = "PEP 8 canonical code formatter required for generated code and development environments [BUILD-ONLY]"

[[dependency]]
name = "nanopb"
openwrt = "nanopb"
pip = "nanopb==0.4.9.1"
rationale = "Zero-heap C protobuf generator and runtime library [BUILD-ONLY]"

[[dependency]]
name = "lmdb"
openwrt = "python3-lmdb"
pip = "lmdb==3.0.0"
rationale = "Ultra-fast memory-mapped C storage engine for persistent queues and key-value datastores"


# =============================================================================
# C++ / Arduino Microcontroller Dependencies (SIL-2 Zero-Heap)
# =============================================================================

[[cpp_dependency]]
name = "Embedded_Template_Library"
github = "ETLCPP/etl"
ref_type = "tags"
version = "20.49.0"
check_file = "include/etl/algorithm.h"
rationale = "Zero-heap, STL-free deterministic C++ template library for SIL-2 MCU algorithms"

[[cpp_dependency]]
name = "Unity"
github = "ThrowTheSwitch/Unity"
ref_type = "tags"
version = "v2.7.0"
check_file = "unity.h"
target_dir = "tests"
rationale = "Host-based deterministic C/C++ unit testing harness for MCU components"

[[cpp_dependency]]
name = "nanopb_core"
github = "nanopb/nanopb"
ref_type = "version"
version = "0.4.9.2"
check_file = "pb.h"
files = [
    "pb.h",
    "pb_common.h",
    "pb_common.c",
    "pb_decode.h",
    "pb_decode.c",
    "pb_encode.h",
    "pb_encode.c",
]
rationale = "Lightweight zero-heap C Protobuf serialization runtime for embedded MCUs"

[[cpp_dependency]]
name = "MbedTLS"
github = "Mbed-TLS/mbedtls"
ref_type = "tags"
version = "mbedtls-4.2.0"
check_file = "tf-psa-crypto/include/psa/crypto.h"
sha256 = "2bed9d713b4668f76553b097e72b8aa30bc8f112a940d7ae228d524bbde6ffea"
rationale = "Pinned Mbed TLS 4 PSA provider for AVR/SAMD link crypto; ESP32 uses core PSA for SHA-256/HMAC and WolfCrypt for HKDF/AEAD"

[[cpp_dependency]]
name = "wolfssl"
github = "wolfSSL/Arduino-wolfSSL"
ref_type = "tags"
version = "5.8.4"
check_file = "library.properties"
check_latest = false
sha256 = "a3199eb282afdff6ed7ee438a175842a8c425a4264022019153e430def20ef96"
rationale = "GPL-3.0-or-later wolfCrypt HKDF-SHA256 and ChaCha20-Poly1305 provider for ESP32; PSA remains the SHA-256/HMAC provider"


