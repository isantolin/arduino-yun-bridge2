name: '🔎 Gemini Review'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 15
    env:
      # Pinned so the extension pre-install and the action use the same CLI.
      GEMINI_CLI_VERSION: "${{ vars.GEMINI_CLI_VERSION || '0.50.0' }}"
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      # Without any Gemini credential the review cannot run; report it and
      # finish instead of failing every pull request.
      - name: 'Check Gemini credentials'
        id: 'credentials'
        env:
          HAS_GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY != '' }}"
          HAS_GOOGLE_API_KEY: "${{ secrets.GOOGLE_API_KEY != '' }}"
          HAS_VERTEX_OR_GCA: "${{ vars.GCP_WIF_PROVIDER != '' }}"
        run: |-
          if [ "$HAS_GEMINI_API_KEY" = "true" ] || [ "$HAS_GOOGLE_API_KEY" = "true" ] || [ "$HAS_VERTEX_OR_GCA" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Gemini review skipped: configure GEMINI_API_KEY, GOOGLE_API_KEY or GCP_WIF_PROVIDER."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ steps.credentials.outputs.available == 'true' && vars.APP_ID }}
        uses: 'actions/create-github-app-token@v3'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Checkout repository'
        if: "${{ steps.credentials.outputs.available == 'true' }}"
        uses: 'actions/checkout@v7'

      - name: 'Read canonical Gemini model'
        id: 'gemini_model'
        if: "${{ steps.credentials.outputs.available == 'true' }}"
        run: |-
          model=''
          IFS= read -r model < tools/gemini_model || true
          if [ -z "$model" ]; then
            echo "::error::tools/gemini_model is empty or unreadable."
            exit 1
          fi
          printf 'model=%s\n' "$model" >> "$GITHUB_OUTPUT"

      # Workaround for google-github-actions/run-gemini-cli#533: the action's
      # `echo "Y" | gemini extensions install` hangs on the code-review
      # extension's second consent prompt. Pre-install it non-interactively;
      # the CLI loads extensions already present under ~/.gemini.
      - name: 'Pre-install Gemini code-review extension'
        if: "${{ steps.credentials.outputs.available == 'true' }}"
        run: |-
          npx --yes "@google/gemini-cli@${GEMINI_CLI_VERSION}" extensions install --consent \
            'https://github.com/gemini-cli-extensions/code-review' </dev/null

      - name: 'Run Gemini pull request review'
        if: "${{ steps.credentials.outputs.available == 'true' }}"
        uses: 'google-github-actions/run-gemini-cli@v0' # ratchet:exclude
        id: 'gemini_pr_review'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.pull_request.body || github.event.issue.body }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ env.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: '${{ steps.gemini_model.outputs.model }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-review'
          # Explicitly set the PR number to handle `issue_comment` triggers (which GitHub treats as issues, not PRs)
          github_pr_number: '${{ github.event.pull_request.number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v1.0.5"
                  ],
                  "includeTools": [
                    "add_issue_comment",
                    "get_issue",
                    "get_issue_comments",
                    "list_issue_comments",
                    "list_issues",
                    "search_issues",
                    "create_pull_request",
                    "get_pull_request",
                    "get_pull_request_review",
                    "get_pull_request_diff",
                    "list_pull_request_files",
                    "list_pull_requests",
                    "list_pull_request_reviews",
                    "search_pull_requests",
                    "create_branch",
                    "create_or_update_file",
                    "delete_file",
                    "fork_repository",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "push_files",
                    "search_code",
                    "add_pull_request_review_comment",
                    "create_pull_request_review",
                    "submit_pull_request_review"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command(cat)",
                  "run_shell_command(echo)",
                  "run_shell_command(grep)",
                  "run_shell_command(head)",
                  "run_shell_command(tail)"
                ]
              }
            }
          prompt: '/pr-code-review'
