[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcubridge"
version = "2.8.6"
description = "Arduino MCU Bridge Protocol for OpenWrt (Python 3.13)"
requires-python = ">=3.13"
dependencies = [
    "annotated-doc==0.0.5",
    "black==26.5.1",
    "cobs==1.2.2",
    "cryptography==50.0.1",
    "grpcio-tools==1.83.1",
    "grpclib==0.4.9",
    "h2==4.4.1",
    "hpack==4.2.0",
    "hyperframe==6.1.0",
    "jinja2==3.1.6",
    "lmdb==2.3.0",
    "nanopb==0.4.9.1",
    "packaging==26.3",
    "prometheus-client==0.26.0",
    "protobuf==7.36.1",
    "psutil==7.2.2",
    "serialx==1.9.0",
    "shellingham==1.5.4",
    "structlog==26.1.0",
    "tenacity==9.1.4",
    "typer==0.27.2",
    "uvloop==0.22.1",
]

[tool.setuptools.packages.find]
where = ["mcubridge"]
include = ["mcubridge*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -vv"
log_cli = true
log_cli_level = "INFO"
testpaths = ["mcubridge/tests", "mcubridge-client-examples/tests", "mcubridge-gateway/tests"]
pythonpath = [".", "mcubridge", "mcubridge-client-examples", "mcubridge-gateway"]
norecursedirs = ["openwrt-sdk", "feeds", ".git", ".tox", ".venv*", ".tmp_tests", ".*"]
markers = [
    "fuzz: mark a test as a fuzz test",
    "timeout: timeout marker accepted during IDE discovery even when pytest-timeout is absent",
]
filterwarnings = [
    "error",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
stubPath = "typings"
extraPaths = ["typings/stubs", "mcubridge", "mcubridge-client-examples", "mcubridge-gateway"]
include = [
    "mcubridge/mcubridge",
    "mcubridge/tests",
    "mcubridge-client-examples/mcubridge_client",
    "mcubridge-gateway",
    "mcubridge/scripts",
    "tools"
]
strict = [
    "mcubridge/mcubridge",
    "mcubridge/tests",
    "mcubridge-client-examples/mcubridge_client",
    "mcubridge-gateway",
    "tools"
]
executionEnvironments = [
    { root = "mcubridge/scripts", reportUnknownMemberType = false }
]
exclude = [
    "openwrt-sdk",
    "tools/protocol/templates",
    ".tox",
    ".venv",
    ".venv_debug",
    "**/__pycache__",
    "**/node_modules",
    "**/*_pb2.py",
    "**/*_pb2.pyi",
    "**/*_grpc.py",
    "**/_pyrefly_virtual__/**",
    "**/__pyrefly_virtual__/**",
    "**/inmemory/**",
    "*_pyrefly_virtual_*",
    "*__pyrefly_virtual_*",
    "**/.*"
]
ignore = [
    "**/_pyrefly_virtual__/**",
    "**/__pyrefly_virtual__/**",
    "**/inmemory/**",
    "*_pyrefly_virtual_*",
    "*__pyrefly_virtual_*"
]
reportMissingImports = true
reportMissingTypeStubs = true
reportMissingModuleSource = false

[tool.black]
target-version = ['py313']
line-length = 120
exclude = '''
/(
    \.git
  | \.tox
  | \.venv
  | \.venv_debug
  | \.tmp_tests
  | typings
  | openwrt-sdk.*
  | tools/protocol/templates
)/
'''

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = ["*_pb2.py", "*_pb2.pyi", "*_grpc.py", "typings", "tools/protocol/templates", ".tmp_tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "A", "PLW"]
extend-select = ["E226"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E402"]
"mcubridge-gateway/*" = ["E402"]

[tool.ruff.lint.mccabe]
# [QUALITY] Reduced from 50 to 25 for SIL-2 compliance and maintainability
max-complexity = 25

[tool.coverage.run]
branch = true
concurrency = ["multiprocessing", "thread"]
relative_files = true
source = [
    "mcubridge/mcubridge",
    "mcubridge-client-examples/mcubridge_client",
    "mcubridge-gateway"
]
omit = [
    "mcubridge/tests/*",
    "mcubridge-client-examples/tests/*",
    "**/*_pb2.py",
    "**/*_pb2.pyi",
    "**/*_grpc.py"
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:"
]
