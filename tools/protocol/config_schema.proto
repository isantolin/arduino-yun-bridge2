message Hardware {
  uint32 max_observers_avr = 1;
  uint32 max_observers_other = 2;
  uint32 rx_buffer_size_avr = 4;
  uint32 rx_buffer_size_other = 5;
  uint32 console_rx_buffer_size_avr = 8;
  uint32 console_rx_buffer_size_other = 9;
  uint32 console_tx_buffer_size_avr = 10;
  uint32 console_tx_buffer_size_other = 11;
  uint32 max_pending_datastore = 14;
  uint32 max_pending_process_polls = 15;
  uint32 baudrate_change_delay_ms = 20 [
    (py_name) = "BAUDRATE_CHANGE_DELAY_MS",
    (py_type) = "int"
  ];
  // Serial RX flow control (MCU side): XOFF when the core's RX buffer holds more
  // than the XOFF threshold, XON once it drains below the XON threshold. Sized
  // at 75 % / 25 % of the core's default RX buffer: 64 B on AVR, 256 B on
  // SAMD (SERIAL_BUFFER_SIZE) and ESP32 (HardwareSerial default).
  uint32 flow_control_xoff_threshold_avr = 23;
  uint32 flow_control_xon_threshold_avr = 24;
  uint32 spi_timeout_ms = 35;
  uint32 bootloader_delay_ms = 36;
  uint32 sha256_digest_size = 38 [
    (cpp_name) = "RPC_SHA256_DIGEST_SIZE",
    (cpp_type) = "uint8_t"
  ];
  uint32 max_safety_pins = 42;
  uint32 max_pin_subscriptions = 43;
  uint32 max_mailbox_queue_size_other = 44;
  uint32 max_mailbox_queue_size_avr = 45;
  uint32 flow_control_xoff_threshold_other = 46;
  uint32 flow_control_xon_threshold_other = 47;
}

message Handshake {
  uint32 nonce_length = 1 [
    (cpp_name) = "RPC_HANDSHAKE_NONCE_LENGTH",
    (cpp_type) = "unsigned int",
    (py_name) = "HANDSHAKE_NONCE_LENGTH",
    (py_type) = "int"
  ];
  uint32 tag_length = 2 [
    (cpp_name) = "RPC_HANDSHAKE_TAG_LENGTH",
    (cpp_type) = "unsigned int",
    (py_name) = "HANDSHAKE_TAG_LENGTH",
    (py_type) = "int"
  ];
  uint32 response_timeout_max_ms = 8 [
    (cpp_name) = "RPC_HANDSHAKE_RESPONSE_TIMEOUT_MAX_MS",
    (cpp_type) = "uint32_t"
  ];
  string hkdf_salt = 12 [
    (py_name) = "HANDSHAKE_HKDF_SALT",
    (py_type) = "bytes"
  ];
  string hkdf_info_auth = 13 [
    (py_name) = "HANDSHAKE_HKDF_INFO_AUTH",
    (py_type) = "bytes"
  ];
  // HKDF info used to derive independent host-to-MCU and MCU-to-host keys.
  string hkdf_info_session = 14 [
    (py_name) = "HANDSHAKE_HKDF_INFO_SESSION",
    (py_type) = "bytes"
  ];
  uint32 hkdf_output_length = 15 [
    (cpp_name) = "RPC_HANDSHAKE_HKDF_OUTPUT_LENGTH",
    (cpp_type) = "unsigned int",
    (py_name) = "HANDSHAKE_HKDF_OUTPUT_LENGTH",
    (py_type) = "int"
  ];
  string hkdf_info_response = 18 [
    (py_name) = "HANDSHAKE_HKDF_INFO_RESPONSE",
    (py_type) = "bytes"
  ];
  // Handshake v2 (ADR-0005): label for the key that derives the MCU's
  // never-repeating nonce contribution on boards without a hardware RNG.
  string hkdf_info_mcu_nonce = 19;
}

